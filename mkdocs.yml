          - Виртуализация: documentation/chapter-2/Виртуализация и гипервизоры.md
          - Linux: documentation/chapter-2/Администрирование Linux.md
          - Windows Server и AD: documentation/chapter-2/Windows Server и Active Directory.md
          - Файловые и печатные службы: documentation/chapter-2/Файловые и печатные службы.md
          - Веб-служба: documentation/chapter-2/Веб-служба.md
          - Электронная почта: documentation/chapter-2/Службы электронной почты.md
          - DNS и DHCP: documentation/chapter-2/DNS и DHCP в администрировании.md
          - Контейнеры и облака: documentation/chapter-2/Контейнеры и облака.md
      - 3. Эксплуатация и мониторинг:
