site_name: Подготовка к дем. экзамену
site_description: Документация для подготовки к демонстрационному экзамену по специальности 09.02.06
site_author: wisyn
site_url: https://imtoptuk.github.io/dem-exam-docs/
repo_url: https://github.com/imTopTuk/dem-exam-docs
repo_name: imTopTuk/dem-exam-docs

theme:
  name: material
  language: ru
  custom_dir: overrides
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/server-network
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tooltips
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

plugins:
  - search:
      lang:
        - ru
        - en
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/wisyn
      name: Telegram @wisyn

nav:
  - Главная: index.md
  - Документация:
      - Обзор: documentation/index.md
      - Welcome: documentation/welcome.md
      - 0. Введение:
          - documentation/chapter-0/index.md
          - Общие сведения об экзамене: documentation/chapter-0/topic-01.md
          - Структура и оценивание: documentation/chapter-0/topic-02.md
          - Правила работы в лаборатории: documentation/chapter-0/topic-03.md
          - Типовые сценарии заданий: documentation/chapter-0/topic-04.md
          - Типовые ошибки и советы: documentation/chapter-0/topic-05.md
      - 1. Базовая настройка сетей:
          - documentation/chapter-1/index.md
          - IP-адресация: documentation/chapter-1/IP-адресация тема.md
          - Базовая настройка: documentation/chapter-1/Базовая настройка тема.md
          - Коммутация L2: documentation/chapter-1/Коммутация L2 тема.md
          - Маршрутизация: documentation/chapter-1/Маршрутизация тема.md
          - Туннелирование: documentation/chapter-1/Туннелирование тема.md
          - Трансляция адресов: documentation/chapter-1/Трансляция адресов.md
          - DHCP: documentation/chapter-1/Служба DHCP.md
          - DNS: documentation/chapter-1/Служба DNS.md
          - Удалённый доступ: documentation/chapter-1/Удаленный доступ.md
          - Практический пример: documentation/chapter-1/Нейрохрючевый пример тут.md
      - 2. Сетевое администрирование:
